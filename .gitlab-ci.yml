stages:
  - test

# Every Node.js version package.json declares support for (engines): the
# floor is only a promise if CI runs it.
test:
  stage: test
  image: node:$NODE_VERSION
  parallel:
    matrix:
      - NODE_VERSION: ["22", "24", "26"]
  before_script:
    - npm ci
  script:
    - npm run typecheck
    - npm run build
    - npm test
    # What the publish workflow packs, caught before a tag.
    - npm pack --dry-run
