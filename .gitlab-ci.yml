stages:
  - test

# Every Node.js version package.json declares support for (engines): the
# floor is only a promise if CI runs it.
test:
  stage: test
  image: node:$NODE_VERSION
  parallel:
    matrix:
      - NODE_VERSION: ["22", "24", "26"]
  before_script:
    - npm install
  script:
    - npm run typecheck
    - npm run build
    - npm test
