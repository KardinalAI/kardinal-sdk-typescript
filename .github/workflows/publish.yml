# Stages @kardinal-ai/sdk on npm with Trusted Publishing (no stored token).
#
# - A tag vX.Y.Z stages a release under the `latest` dist-tag; a tag
#   vX.Y.Z-dev.N stages a pre-release under `next`, which a plain
#   `npm install @kardinal-ai/sdk` never picks. Tags are created on the
#   source repository and reach this one through a push mirror.
# - The workflow only stages the package (`npm stage publish`): nothing is
#   live until a maintainer approves it on npmjs.com (Staged Packages tab)
#   or with `npm stage approve <stage-id>`, with two-factor authentication.
#   The trusted publisher on npmjs.com allows staging only.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install
        run: npm ci
      - name: Check the tag matches the package version
        run: node scripts/check-tag-matches-version.mjs "$GITHUB_REF_NAME"
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error

  stage:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@kardinal-ai/sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Staged publishing needs npm >= 11.15.0, newer than the npm bundled
      # with Node: pinned so a release doesn't depend on whatever ships.
      - name: Install npm
        run: npm install -g npm@11.20.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - name: Stage on npm
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm stage publish ./*.tgz --tag "$dist_tag"
